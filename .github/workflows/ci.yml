name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test (Java + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (backend tests, frontend tests and build, formatting)
        run: ./mvnw -B verify

  postgres:
    name: Schema on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beacon
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Liquibase + JPA validation + a real snapshot on PostgreSQL
        env:
          BEACON_TEST_PG_URL: jdbc:postgresql://localhost:5432/beacon
        run: ./mvnw -B -Dskip.installnodenpm -Dskip.npm -Dtest=PostgresSchemaTest -Dsurefire.failIfNoSpecifiedTests=false test
